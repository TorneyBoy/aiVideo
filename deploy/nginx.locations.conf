# Include ONLY inside the existing huayuan.ink HTTPS server block.
# These locations do not change the existing / application or TLS certificate.
location = /aiVideo {
    return 308 /aiVideo/;
}

location ^~ /aiVideo/media/ {
    proxy_pass http://127.0.0.1:14173;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_buffering off;
    # Signed query strings must not enter access logs.
    access_log off;
    error_log /var/log/nginx/aivideo-material-error.log crit;
}

location ^~ /aiVideo/ {
    client_max_body_size 1600m;
    client_body_timeout 900s;
    proxy_pass http://127.0.0.1:14173;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    access_log /var/log/nginx/aivideo-access.log;
    error_log /var/log/nginx/aivideo-error.log warn;
}
